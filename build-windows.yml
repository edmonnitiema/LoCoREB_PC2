name: Construire LoCoREB pour Windows

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - name: Récupérer les fichiers
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installer les outils
        run: npm install

      - name: Construire le programme Windows
        run: npm run dist

      - name: Publier les programmes
        uses: actions/upload-artifact@v4
        with:
          name: LoCoREB-Windows
          path: |
            dist/LoCoREB-Installateur.exe
            dist/LoCoREB-Portable.exe
